name: release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to verify, for example v1.0.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'guoryu-cmyk/sdk-release-sandbox'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Pin the tag commit
        id: ref
        shell: bash
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sha="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF" == "refs/tags/$TAG" && "$sha" == "$EVENT_SHA" ]]
          fi
          git checkout --detach "$sha"
          printf 'tag=%s\nsha=%s\n' "$TAG" "$sha" >> "$GITHUB_OUTPUT"

      - name: Verify the SDK version, module and Changelog
        shell: bash
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          grep -Fx "const SDKVersion = \"$TAG\"" base/version.go
          grep -Fx 'module github.com/guoryu-cmyk/sdk-release-sandbox' go.mod
          grep -Ex "[0-9]{4}-[0-9]{2}-[0-9]{2} Bumped to version ${TAG//./\\.}" Changelog

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.5'
          cache: false

      - name: Test and build
        run: |
          go test ./...
          go build ./...

  github-release:
    needs: verify
    if: github.event_name == 'push' && github.repository == 'guoryu-cmyk/sdk-release-sandbox'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false

      - name: Extract release notes
        shell: bash
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          awk -v tag="$TAG" '
            collecting && !NF { exit }
            collecting { print }
            $NF == tag && $2 == "Bumped" { collecting=1 }
          ' Changelog > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          tag = os.environ["TAG"]
          sha = os.environ["RELEASE_SHA"]
          api = f'{os.environ["GITHUB_API_URL"]}/repos/{os.environ["GITHUB_REPOSITORY"]}'
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f'Bearer {os.environ["GH_TOKEN"]}',
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def github(path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              request = Request(f"{api}/{path}", data=data, headers=headers)
              with urlopen(request, timeout=30) as response:
                  return json.load(response)

          try:
              ref = github(f"git/ref/tags/{tag}")["object"]
              if ref.get("type") != "commit" or ref.get("sha") != sha:
                  raise SystemExit("GitHub tag does not point to the verified commit")
              try:
                  release = github(f"releases/tags/{tag}")
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  notes = Path(os.environ["RUNNER_TEMP"], "release-notes.md").read_text(encoding="utf-8")
                  release = github("releases", {
                      "tag_name": tag, "target_commitish": sha, "name": tag, "body": notes,
                      "draft": False, "prerelease": False,
                  })
              if release.get("tag_name") != tag or release.get("draft") or release.get("prerelease"):
                  raise SystemExit("GitHub Release is not a published release for the verified tag")
          except HTTPError as error:
              raise SystemExit(f"GitHub API returned HTTP {error.code}") from None
          except (OSError, ValueError, KeyError):
              raise SystemExit("Unable to read the release notes or GitHub API response") from None
          PY
